name: Test Canva Image
on:
  push:
    paths:
      - '.github/workflows/test-canva-image.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download requested full-size asset
        run: |
          mkdir -p assets/travel-gallery-final
          curl -fL 'https://media.canva.com/v2/image-resize/format:PNG/height:1402/quality:100/uri:ifs%3A%2F%2FM%2F759c5566-f20f-489d-8535-6064208945d3/watermark:F/width:1122?csig=AAAAAAAAAAAAAAAAAAAAAOwEgoj2EcD9TM7DrqZMWlgG9RWX5kOhCNuDOIEwcVGP&exp=1785756988&osig=AAAAAAAAAAAAAAAAAAAAAMpQ8NUnyTIww3pPJBwsmI_6-Jko5g0dvd3Vt6kkkwDl&signer=media-rpc&x-canva-quality=thumbnail' -o assets/travel-gallery-final/test-full.png
          file assets/travel-gallery-final/test-full.png
          identify assets/travel-gallery-final/test-full.png || true
      - name: Commit test asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/travel-gallery-final/test-full.png
          git commit -m 'chore: add tested full-resolution gallery asset' || exit 0
          git push