name: Test Canva Image
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Capture requested design at high resolution
        run: |
          mkdir -p assets/travel-gallery-final
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "Chrome: $CHROME"
          "$CHROME" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=1122,1402 --virtual-time-budget=10000 --screenshot=assets/travel-gallery-final/test-capture.png 'https://www.canva.com/d/bvm6RxyRA54W6Me'
          file assets/travel-gallery-final/test-capture.png
      - name: Commit test asset to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/travel-gallery-final/test-capture.png
          git commit -m 'chore: add tested high-resolution gallery capture' || exit 0
          git push origin HEAD:${{ github.head_ref }}