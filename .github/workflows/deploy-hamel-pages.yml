name: Deploy Hamel Demo Pages

on:
  push:
    branches: [main]
    paths:
      - 'entwurf/viehhandlung-hamel.html'
      - '.github/workflows/deploy-hamel-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare demo artifact
        run: |
          mkdir -p _site
          cp entwurf/viehhandlung-hamel.html _site/index.html
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
