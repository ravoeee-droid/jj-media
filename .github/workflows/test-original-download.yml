name: Test Original Image Download
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Download full-size original
        run: |
          mkdir -p assets/original-test
          curl -fL 'https://media.canva.com/v2/image-resize/format:PNG/height:1402/quality:100/uri:ifs%3A%2F%2FM%2Fab51d509-7c69-4a7a-aef2-a79aac7f19c7/watermark:F/width:1122?csig=AAAAAAAAAAAAAAAAAAAAALsmTVsA9CNtrq612q_Jv0GzID63tafsvuwLvsxwdy_2&exp=1785768264&osig=AAAAAAAAAAAAAAAAAAAAAJkVbMIJ4v3sWiuPEsX3C6KoFhduwl6ur_9RavPlUOCy&signer=media-rpc&x-canva-quality=thumbnail' -o assets/original-test/01.png
          file assets/original-test/01.png
      - name: Commit test image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/original-test/01.png
          git commit -m 'test: add full-size original image' || exit 0
          git push origin HEAD:${{ github.head_ref }}
