<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<meta name="description" content="JJ-Media Social-Media-Analyse für Instagram, Facebook, YouTube und LinkedIn – persönlich geprüft statt generischem Sofort-Score.">
<link rel="canonical" href="analyse.html">
<title>Social-Media-Analyse – JJ-Media</title>
<style>html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#151218;color:#fff}body{display:grid;place-items:center}.wrap{max-width:720px;padding:40px;text-align:center}.mark{width:56px;height:56px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:#e45167;font-weight:900}.wrap h1{font-size:clamp(2rem,6vw,4rem);line-height:1;margin:0 0 16px}.wrap p{color:#b8b1bb;line-height:1.6}.wrap a{display:inline-block;margin-top:18px;padding:14px 20px;border-radius:14px;background:#e45167;color:#fff;text-decoration:none;font-weight:800}</style>
</head>
<body>
<main class="wrap"><div class="mark">JJ</div><h1>Deine Analyse wird persönlich vorbereitet.</h1><p>Wir prüfen Instagram, Facebook, YouTube und LinkedIn nicht mehr als generischen Sofort-Score. Deine Angaben gehen direkt in den persönlichen JJ-Media Analyseprozess.</p><a id="continue-link" href="analyse.html?entry=legacy-audit">Kostenlose Analyse starten ↗</a></main>
<script>
(() => {
  const source = new URLSearchParams(location.search);
  const target = new URL('analyse.html', location.href);
  target.searchParams.set('entry','legacy-audit');
  const profile = source.get('profile');
  if (profile) target.searchParams.set('profile',profile);
  ['utm_source','utm_medium','utm_campaign'].forEach(key => { const value=source.get(key); if(value) target.searchParams.set(key,value); });
  const href = `${target.pathname.split('/').pop()}${target.search}`;
  document.getElementById('continue-link').href = href;
  setTimeout(() => location.replace(href), 250);
})();
</script>
</body>
</html>
